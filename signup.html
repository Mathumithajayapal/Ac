<!DOCTYPE html>
<html lang="en" dir="ltr" class="transition-colors duration-300">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>AeroHVAC · Sign Up | Create Your Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/jpeg" href="images\Allergen Defense.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 500: '#0284c7', 600: '#0369a1', 400: '#38bdf8' },
            darkBg: '#0f0f0f',
            darkCard: '#1a1a1a',
            darkBorder: '#2c2c2c'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="text-gray-900 dark:text-white transition-colors duration-300 overflow-x-hidden font-sans bg-white dark:bg-black">

  <div class="fixed top-6 right-6 z-[1002] flex items-center gap-3">
    <button id="darkToggleBtn" class="w-10 h-10 flex items-center justify-center bg-gray-100 dark:bg-darkCard border border-gray-200 dark:border-darkBorder text-gray-800 dark:text-white rounded-full hover:border-primary-500 dark:hover:border-primary-500 hover:text-primary-500 transition-colors shadow-sm">
      🌙
    </button>
    <button id="rtlToggleBtn" class="w-10 h-10 flex items-center justify-center bg-gray-100 dark:bg-darkCard border border-gray-200 dark:border-darkBorder text-gray-800 dark:text-white rounded-full text-sm font-semibold hover:border-primary-500 dark:hover:border-primary-500 hover:text-primary-500 transition-colors shadow-sm">
      LTR
    </button>
   
  </div>

  <section class="min-h-[100dvh] flex items-center justify-center pt-20 pb-12 sm:py-12 px-4 sm:px-6 lg:px-8 bg-white dark:bg-black transition-colors duration-300 relative">
    
    <div class="relative z-10 w-full max-w-lg bg-white dark:bg-darkCard rounded-[24px] sm:rounded-[32px] shadow-2xl border border-gray-200 dark:border-darkBorder p-6 sm:p-10 transform transition-all my-8 sm:my-10">
      
      <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center justify-center gap-2 group mb-5">
          <div class="w-12 h-12 bg-primary-500 rounded-xl flex items-center justify-center transition-transform group-hover:scale-105 shadow-lg shadow-primary-500/30">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="w-7 h-7">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <span class="text-3xl font-semibold tracking-tight text-black dark:text-white">
            Aero<span class="text-primary-500">HVAC</span>
          </span>
        </a>
        <h2 class="text-2xl font-semibold text-gray-900 dark:text-white">Create Account</h2>
        <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm">Join AeroHVAC to easily manage your home's climate.</p>
      </div>

      <form id="signupForm" class="space-y-5">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">First Name</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fa-solid fa-user text-gray-400"></i>
              </div>
              <input type="text" required class="w-full pl-11 pr-4 py-3.5 bg-gray-50 dark:bg-[#2a2a2a] border border-gray-300 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:border-primary-500 dark:focus:border-primary-400 text-gray-900 dark:text-white transition-colors" placeholder="John">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fa-regular fa-user text-gray-400"></i>
              </div>
              <input type="text" required class="w-full pl-11 pr-4 py-3.5 bg-gray-50 dark:bg-[#2a2a2a] border border-gray-300 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:border-primary-500 dark:focus:border-primary-400 text-gray-900 dark:text-white transition-colors" placeholder="Doe">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-envelope text-gray-400"></i>
            </div>
            <input type="email" required class="w-full pl-11 pr-4 py-3.5 bg-gray-50 dark:bg-[#2a2a2a] border border-gray-300 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:border-primary-500 dark:focus:border-primary-400 text-gray-900 dark:text-white transition-colors" placeholder="name@example.com">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Phone Number</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-phone text-gray-400"></i>
            </div>
            <input type="tel" required class="w-full pl-11 pr-4 py-3.5 bg-gray-50 dark:bg-[#2a2a2a] border border-gray-300 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:border-primary-500 dark:focus:border-primary-400 text-gray-900 dark:text-white transition-colors" placeholder="(555) 000-0000">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Create Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-lock text-gray-400"></i>
            </div>
            <input type="password" id="passwordInput" required class="w-full pl-11 pr-12 py-3.5 bg-gray-50 dark:bg-[#2a2a2a] border border-gray-300 dark:border-zinc-700 rounded-xl text-sm focus:outline-none focus:border-primary-500 dark:focus:border-primary-400 text-gray-900 dark:text-white transition-colors" placeholder="••••••••">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-gray-400 hover:text-primary-500 transition-colors" id="togglePassword">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </div>
          </div>
          <p class="text-xs text-gray-500 mt-2">Must be at least 8 characters long.</p>
        </div>

        <div class="flex items-start mt-2">
          <div class="flex items-center h-5">
            <input id="terms" type="checkbox" required class="h-4 w-4 text-primary-500 focus:ring-primary-500 bg-gray-50 dark:bg-[#2a2a2a] border-gray-300 dark:border-zinc-700 rounded cursor-pointer transition-colors mt-0.5">
          </div>
          <div class="ml-3 text-sm">
            <label for="terms" class="text-gray-600 dark:text-gray-400 cursor-pointer select-none">
              I agree to the <a href="#" class="text-primary-500 font-medium hover:underline">Terms of Service</a> and <a href="#" class="text-primary-500 font-medium hover:underline">Privacy Policy</a>.
            </label>
          </div>
        </div>

        <button type="submit" class="w-full bg-primary-500 text-white font-semibold py-3.5 rounded-xl hover:bg-primary-600 hover:-translate-y-0.5 transition-all shadow-lg hover:shadow-primary-500/30 mt-4">
          Create Account
        </button>
      </form>

      <div class="mt-8 flex items-center justify-center space-x-4">
        <span class="h-px w-full bg-gray-200 dark:bg-darkBorder"></span>
        <span class="text-xs text-gray-500 font-medium uppercase tracking-wider whitespace-nowrap">Or sign up with</span>
        <span class="h-px w-full bg-gray-200 dark:bg-darkBorder"></span>
      </div>

      <div class="mt-6 grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-2 py-3 border border-gray-200 dark:border-zinc-700 rounded-xl text-gray-700 dark:text-gray-300 font-medium hover:bg-gray-50 dark:hover:bg-[#2a2a2a] transition-colors text-sm">
          <i class="fa-brands fa-google text-red-500"></i> Google
        </button>
        <button class="flex items-center justify-center gap-2 py-3 border border-gray-200 dark:border-zinc-700 rounded-xl text-gray-700 dark:text-gray-300 font-medium hover:bg-gray-50 dark:hover:bg-[#2a2a2a] transition-colors text-sm">
          <i class="fa-brands fa-apple text-gray-900 dark:text-white"></i> Apple
        </button>
      </div>

      <div class="mt-8 text-center">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          Already have an account? 
          <a href="login.html" class="font-semibold text-primary-500 hover:text-primary-600 transition-colors">Sign in</a>
        </p>
      </div>
    </div>
  </section>

  <script>
    // --- Dark Mode Logic ---
    function setDarkMode(isDark) {
      if(isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('darkMode', isDark);
      
      const darkToggle = document.getElementById('darkToggleBtn');
      if(darkToggle) darkToggle.innerHTML = isDark ? '☀️' : '🌙';
    }

    document.getElementById('darkToggleBtn')?.addEventListener('click', () => {
      setDarkMode(!document.documentElement.classList.contains('dark'));
    });
    
    if(localStorage.getItem('darkMode') === 'true') {
      setDarkMode(true);
    }

    // --- RTL Logic ---
    function setRTL(isRTL) {
      document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
      localStorage.setItem('rtlMode', isRTL);
      
      const rtlToggle = document.getElementById('rtlToggleBtn');
      if(rtlToggle) rtlToggle.innerText = isRTL ? 'RTL' : 'LTR';
    }

    const toggleRtlAction = () => {
      setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
    };
    
    document.getElementById('rtlToggleBtn')?.addEventListener('click', toggleRtlAction);
    
    if(localStorage.getItem('rtlMode') === 'true') {
      setRTL(true);
    }

    // --- Show/Hide Password Toggle ---
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');

    if(togglePassword && passwordInput) {
      togglePassword.addEventListener('click', function (e) {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        if(type === 'text') {
          eyeIcon.classList.remove('fa-eye');
          eyeIcon.classList.add('fa-eye-slash');
        } else {
          eyeIcon.classList.remove('fa-eye-slash');
          eyeIcon.classList.add('fa-eye');
        }
      });
    }

    // --- Signup Form Submit ---
    const signupForm = document.getElementById('signupForm');
    if(signupForm) {
      signupForm.addEventListener('submit', function(e) {
        e.preventDefault();
        alert('✨ Account created successfully! Welcome to AeroHVAC. ✨');
        signupForm.reset();
      });
    }

  </script>
</body>
</html>
